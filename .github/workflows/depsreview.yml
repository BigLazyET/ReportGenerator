name: 'Dependency Review'
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base Git ref for dependency comparison
        required: true
        default: main
        type: string
      head_ref:
        description: Head Git ref (empty uses the selected workflow commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref || github.sha }}
