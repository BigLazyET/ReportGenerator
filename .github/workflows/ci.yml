name: Engine CI
on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'global.json'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/NuGet.Config'
      - 'src/ReportGenerator.snk'
      - 'src/ReportGenerator.Core/**'
      - 'src/ReportGenerator.DotnetCorePluginLoader/**'
      - 'src/ReportGenerator.MSBuild/**'
      - 'src/ReportGenerator.Core.Test/ReportGenerator.Core.Test.csproj'
      - 'src/ReportGenerator.Core.Test/FileManager.cs'
      - 'src/ReportGenerator.Core.Test/LimitedVerbosityFixture.cs'
      - 'src/ReportGenerator.Core.Test/Issues/**'
      - 'src/ReportGenerator.Core.Test/Parser/Analysis/**'
      - 'src/ReportGenerator.Core.Test/Parser/Filtering/**'
      - 'src/ReportGenerator.Core.Test/Parser/FileReading/LocalFileReader*'
      - 'src/ReportGenerator.Core.Test/Parser/Cobertura*'
      - 'src/ReportGenerator.Core.Test/Parser/CoverageReportParser*'
      - 'src/ReportGenerator.Core.Test/Parser/ParserResult*'
      - 'src/ReportGenerator.Core.Test/Parser/Preprocessing/Cobertura*'
      - 'src/ReportGenerator.Core.Test/Reporting/**'
      - 'src/ReportGenerator.Core.Test/ReportConfiguration*'
      - 'src/ReportGenerator.Core.Test/Common/MathExtensions*'
      - 'src/Testprojects/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'global.json'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/NuGet.Config'
      - 'src/ReportGenerator.snk'
      - 'src/ReportGenerator.Core/**'
      - 'src/ReportGenerator.DotnetCorePluginLoader/**'
      - 'src/ReportGenerator.MSBuild/**'
      - 'src/ReportGenerator.Core.Test/ReportGenerator.Core.Test.csproj'
      - 'src/ReportGenerator.Core.Test/FileManager.cs'
      - 'src/ReportGenerator.Core.Test/LimitedVerbosityFixture.cs'
      - 'src/ReportGenerator.Core.Test/Issues/**'
      - 'src/ReportGenerator.Core.Test/Parser/Analysis/**'
      - 'src/ReportGenerator.Core.Test/Parser/Filtering/**'
      - 'src/ReportGenerator.Core.Test/Parser/FileReading/LocalFileReader*'
      - 'src/ReportGenerator.Core.Test/Parser/Cobertura*'
      - 'src/ReportGenerator.Core.Test/Parser/CoverageReportParser*'
      - 'src/ReportGenerator.Core.Test/Parser/ParserResult*'
      - 'src/ReportGenerator.Core.Test/Parser/Preprocessing/Cobertura*'
      - 'src/ReportGenerator.Core.Test/Reporting/**'
      - 'src/ReportGenerator.Core.Test/ReportConfiguration*'
      - 'src/ReportGenerator.Core.Test/Common/MathExtensions*'
      - 'src/Testprojects/**'
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete engine test suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FOCUSED_FILTER: 'FullyQualifiedName~Cobertura|FullyQualifiedName~CoverageReportParser|FullyQualifiedName~.Test.Issues.|FullyQualifiedName~.Test.Parser.Analysis.|FullyQualifiedName~.Test.Parser.Filtering.|FullyQualifiedName~LocalFileReader|FullyQualifiedName~ParserResult|FullyQualifiedName~.Test.Reporting.|FullyQualifiedName~ReportConfiguration|FullyQualifiedName~MathExtensions'
jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Related engine regression (manual full suite available)
        shell: pwsh
        env:
          FULL_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          $arguments = @('test', 'src/ReportGenerator.Core.Test/ReportGenerator.Core.Test.csproj',
            '-c', 'Release', '--logger', 'trx;LogFileName=engine.trx', '--results-directory', 'artifacts/tests')
          if ($env:FULL_SUITE -ne 'true') { $arguments += @('--filter', $env:FOCUSED_FILTER) }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$result = Get-Content artifacts/tests/engine.trx
          $counters = $result.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counters -or [int]$counters.executed -eq 0) { throw 'No engine tests executed' }
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests
          path: artifacts/tests/
